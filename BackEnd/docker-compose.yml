services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mode_studio_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - mode_network
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: mode_studio_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mode_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: mode_studio_mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-storage-engine=INNODB
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-mode_studio}
      MYSQL_USER: ${DB_USERNAME:-mode_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mode_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mode_studio_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    networks:
      - mode_network
    depends_on:
      - mysql

networks:
  mode_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  app_vendor:
    driver: local
